        <h2>Photo Gallery</h2>
        <p>Here are some photos from three of my Sierra hikes.</p>
        <section>
            <h3>Mount Agassiz</h3>
            <div class="gallery">
                <figure>
                    <a href="images/agassiz-morning.jpg"><img src="images/agassiz-morning.jpg" alt="Mount Agassiz in warm morning light with a hiker on the rocky trail" loading="lazy"></a>
                    <figcaption>Morning light on Mount Agassiz.</figcaption>
                </figure>
                <figure>
                    <a href="images/agassiz-view.jpg"><img src="images/agassiz-view.jpg" alt="Jagged Sierra peaks and patches of snow beneath a cloudy sky" loading="lazy"></a>
                    <figcaption>Mountain views from my Agassiz hike.</figcaption>
                </figure>
            </div>
        </section>
        <section>
            <h3>Cloudripper</h3>
            <div class="gallery">
                <figure>
                    <a href="images/cloudripper-trail.jpg"><img src="images/cloudripper-trail.jpg" alt="Rocky slope above alpine lakes along the Cloudripper hike" loading="lazy"></a>
                    <figcaption>A rocky section of the Cloudripper hike.</figcaption>
                </figure>
                <figure>
                    <a href="images/cloudripper-ridge.jpg"><img src="images/cloudripper-ridge.jpg" alt="A narrow rocky ridge on Cloudripper beneath a clear blue sky" loading="lazy"></a>

                </figure>

        </section>
        <section>
            <h3>Mount Langley</h3>
            <div class="gallery">
                <figure>

                </figure>
                <figure>
                    <a href="images/langley-lake.jpg"><img src="images/langley-lake.jpg" alt="Clear alpine lake with trees and mountains on the Mount Langley hike" loading="lazy"></a>
